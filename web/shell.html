<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検体検査装置 操作画面（LVGL 8.3.11 ブラウザ版）</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    background: #0b0f14;
    color: #e6eaf0;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.1rem; margin: 4px 0 6px; }
  p { color: #aab4c3; font-size: 0.9rem; line-height: 1.6; margin: 8px 0; }
  .screen {
    position: relative;
    width: 100%;
    /* 画面の高さにも収まる幅にする（横向きのスマホで、はみ出してスクロールしないように） */
    width: min(100%, calc((100svh - 32px) * 800 / 480));
    margin: 0 auto;
    aspect-ratio: 800 / 480;
    background: #10151c;
    border: 1px solid #2a3646;
    border-radius: 8px;
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #8a96a8; pointer-events: none;
  }
  .portrait-hint { display: none; color: #ffb020; }
  @media (orientation: portrait) and (max-width: 600px) { .portrait-hint { display: block; } }
  /* 横向きのスマホ: 説明文を隠し、装置の画面だけを高さいっぱいに出す */
  @media (orientation: landscape) and (max-height: 500px) {
    main { max-width: none; padding: 8px; }
    h1, p { display: none; }
    .screen { width: min(100%, calc((100svh - 16px) * 800 / 480)); }
  }
  a { color: #4fa3ff; }
</style>
</head>
<body>
<main>
  <h1>検体検査装置 操作画面（LVGL 8.3.11）</h1>
  <p>C++ と LVGL で作った組込み機器向けの画面を、WebAssembly にしてブラウザで動かしています。画面のボタンを押して操作できます。表示値はすべて模擬データです。</p>
  <div class="screen">
    <canvas id="screen" width="800" height="480"></canvas>
    <div id="loading">読み込み中…</div>
  </div>
  <p class="portrait-hint">スマートフォンは横向きにすると大きく表示されます。</p>
  <p>「開始」で 10 検体を 1 本 3 秒ずつ測定します。途中で「停止」→「再開」、完了後に「リセット」ができます。</p>
  <p><a href="https://github.com/shinbaru0422/lvgl-analyzer-demo">ソースコードと設計資料（GitHub）</a></p>
</main>
<script>
  var Module = {
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    onRuntimeInitialized: function () { document.getElementById('loading').remove(); }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
